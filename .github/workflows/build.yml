name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore TeaChest.sln
      - name: Build
        run: dotnet build TeaChest.sln -c Release --no-restore
      - name: Test
        run: dotnet test TeaChest.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish framework-dependent
        run: >
          dotnet publish src/TeaChest/TeaChest.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeaChest-win-x64
          path: dist/win-x64
          if-no-files-found: error

  # TeaChest.Core and its tests on Linux, so nothing Windows-only creeps into the shared code.
  # The Windows job above still builds and tests the whole solution, Core included.
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/TeaChest.Core.Tests/TeaChest.Core.Tests.csproj
      - name: Build
        run: dotnet build tests/TeaChest.Core.Tests/TeaChest.Core.Tests.csproj -c Release --no-restore -p:EnableWindowsTargeting=false
      - name: Test
        run: dotnet test tests/TeaChest.Core.Tests/TeaChest.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
